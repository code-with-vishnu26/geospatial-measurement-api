[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "FastAPI service that extracts features from KML/Shapefiles and computes CRS-correct measurements."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "N"]
ignore = ["RUF001"]  # "m²" is an intentional unit symbol

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
